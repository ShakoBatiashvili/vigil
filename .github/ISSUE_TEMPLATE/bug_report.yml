name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vigil version
      description: Output of `vigil version`
      placeholder: vigil 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Pro M2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Homebrew, From source, Other]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output (optional)
      description: >-
        For example `vigil status` or `vigil holders`. These can include the names of your running apps, so
        redact anything you would rather not share.
      render: text
